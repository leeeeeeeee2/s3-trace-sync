<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S3 Trace Sync</title>
  <meta id="go" http-equiv="refresh" content="8;url=http://127.0.0.1:3483/">
  <style>
    :root { color-scheme: light dark; }
    html, body { margin: 0; height: 100%; }
    body {
      display: grid;
      place-items: center;
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: Canvas;
      color: CanvasText;
    }
    .box { text-align: center; color: GrayText; max-width: 320px; padding: 16px; }
    .box b { display: block; color: CanvasText; font-size: 14px; margin-bottom: 10px; }
    .bar {
      width: 200px;
      height: 3px;
      border-radius: 2px;
      background: color-mix(in srgb, CanvasText 14%, transparent);
      overflow: hidden;
      margin: 0 auto 8px;
    }
    .bar i {
      display: block;
      height: 100%;
      width: 15%;
      border-radius: 2px;
      background: #f38020;
      transition: width .35s ease;
    }
    .bar.bad i { background: #ef4444; }
    .box span { display: block; font-size: 12px; min-height: 2.4em; }
    .box span.bad { color: #ef4444; }
  </style>
</head>
<body>
  <div class="box">
    <b>S3 Trace Sync</b>
    <div class="bar"><i id="bar"></i></div>
    <span id="msg">Connecting to Magpie bridge…</span>
  </div>
  <script src="_magpie/bridge.js"></script>
  <script src="boot.js"></script>
</body>
</html>
